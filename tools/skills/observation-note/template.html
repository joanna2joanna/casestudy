<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 22mm 18mm 22mm 18mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 14pt;
    line-height: 1.75;
    overflow-wrap: break-word;
    color: #1c2833;
    text-wrap: pretty;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── Cover ── */
  .cover {
    page-break-after: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 0 24px 0;
    text-align: center;
  }
  .cover h1 {
    font-size: 32pt;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 6px;
    line-height: 1.5;
    word-break: keep-all;
  }
  .cover h1 .blue { color: #0d47a1; }
  .cover h1 .orange { color: #e65100; }
  .cover .sub {
    font-size: 12pt;
    color: #546e7a;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .cover .meta {
    font-size: 12pt;
    color: #607d8b;
    width: 85%;
    max-width: 580px;
  }
  .cover .decl {
    margin-top: 6px;
    font-size: 12pt;
    font-weight: 600;
    color: #0d47a1;
  }
  .data-note {
    font-size: 12pt;
    color: #607d8b;
    width: 85%;
    max-width: 580px;
    margin-top: 4px;
    line-height: 1.6;
  }
  .data-src {
    font-size: 12pt;
    color: #607d8b;
    width: 85%;
    max-width: 580px;
    margin-top: 4px;
    line-height: 1.6;
  }

  /* ── 缘起 ── */
  .prologue {
    font-size: 14pt;
    color: #455a64;
    margin: 0 0 24px 0;
    text-align: justify;
    line-height: 1.75;
  }

  /* ── Section ── */
  h2 {
    font-size: 20pt;
    font-weight: 700;
    color: #0d47a1;
    background: #f0f6ff;
    padding: 12px 18px;
    border-left: 4px solid #e65100;
    border-radius: 0 8px 8px 0;
    margin: 48px 0 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2 .num {
    background: #e65100;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16pt;
    flex-shrink: 0;
  }
  h3 {
    font-size: 16pt;
    font-weight: 700;
    color: #0d47a1;
    margin: 16px 0 8px 0;
    padding-left: 12px;
    border-left: 3px solid #e65100;
  }
  p { margin-bottom: 10px; text-align: justify; }

  /* ── Highlight Box ── */
  .hl-box {
    background: #FFF8F0;
    border-left: 4px solid #e65100;
    padding: 12px 18px;
    margin: 12px 0;
    border-radius: 0 8px 8px 0;
    text-align: justify;
  }
  .hl-box.orange {
    background: #FFF3E0;
    border-left-color: #e65100;
  }
  .hl-box strong { color: #0d47a1; }
  .hl-box.orange strong { color: #e65100; }

  /* ── Table ── */
  table {
    table-layout: fixed;
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0 14px 0;
    font-size: 14pt;
  }
  th:first-child, td:first-child { width: 22%; min-width: 120px; }
  thead th {
    background: #0d47a1;
    color: #fff;
    padding: 8px 12px;
    text-align: left;
    font-weight: 600;
  }
  td {
    padding: 7px 12px;
    border-bottom: 1px solid #e0e0e0;
  }
  tbody tr:nth-child(even) { background: #f5f9ff; }

  /* ── Grid Cards ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0;
  }
  .card {
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 14px;
    overflow-wrap: break-word;
  }
  .card-title {
    font-size: 14pt;
    font-weight: 700;
    color: #0d47a1;
    margin-bottom: 6px;
  }
  .card p { font-size: 14pt; margin: 0; color: #444; }

  /* ── Tag row ── */
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .tag {
    background: #f0f6ff;
    color: #0d47a1;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12pt;
  }
  .tag.orange { background: #FFF3E0; color: #e65100; }

  /* ── Insight block ── */
  .insight {
    background: #FFF8F0;
    color: #1c2833;
    border-left: 4px solid #e65100;
    padding: 18px 22px;
    margin: 18px 0;
  }
  .insight h3 { color: #e65100; border: none; padding: 0; margin-bottom: 10px; font-size: 16pt; }
  .insight p { color: #1c2833; font-size: 14pt; }
  .insight ul { padding-left: 18px; margin: 6px 0; }
  .insight li { font-size: 14pt; color: #1c2833; margin: 4px 0; }

  /* ── Data highlight ── */
  .big-num {
    font-size: 32pt;
    font-weight: 800;
    color: #e65100;
  }
  .big-num small {
    font-size: 15pt;
    color: #455a64;
    font-weight: 500;
  }

  .two-col { display: flex; gap: 20px; margin: 10px 0; }
  .two-col > div { flex: 1; }
  .footer {
    text-align: center;
    padding: 40px 24px 48px;
    color: #6d6d72;
    font-size: 13px;
    line-height: 1.8;
  }

  /* ── 观察笔记特有 ── */
  .pull {
    font-size: 15pt;
    font-weight: 600;
    color: #e65100;
    margin: 28px 0;
    padding: 16px 20px;
    background: #fff8f0;
    border-radius: 4px;
    line-height: 1.6;
  }
  .field-note {
    font-size: 12.5pt;
    color: #455a64;
    background: #f5f7fa;
    padding: 14px 18px;
    margin: 24px 0;
    border-radius: 4px;
    line-height: 1.7;
  }
  .outro {
    font-size: 13pt;
    color: #546e7a;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #eceff1;
    line-height: 1.7;
  }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    body { font-size: 15px; padding: 0 20px; }
    .cover h1 { font-size: 26px; letter-spacing: 2px; word-break: break-all; }
    .cover .sub { font-size: 14px; }
    .cover .meta,
    .cover .decl,
    .data-note,
    .data-src { width: 100%; max-width: 100%; font-size: 13px; }
    h2 { font-size: 18px; padding: 10px 14px; margin: 32px 0 16px; word-break: break-all; }
    h2 .num { width: 24px; height: 24px; font-size: 14px; }
    h3 { font-size: 16px; }
    p { font-size: 15px; }
    table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; font-size: 13px; }
    th, td { white-space: nowrap; padding: 8px 10px; }
    .hl-box { padding: 12px 14px; }
    .insight { padding: 14px 16px; }
    ul, ol { padding-left: 20px; }
    .card { padding: 12px; }
    .big-num { font-size: 26px; }
    .pull { font-size: 14px; padding: 12px 14px; }
    .outro { font-size: 13px; }
    .footer { font-size: 12px; padding: 28px 0 36px; }
    .two-col { flex-direction: column; gap: 12px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ═════ COVER ═════ -->
<div class="cover">
  <h1>{{H1_LINE_1}}<br/>{{H1_LINE_2}}</h1>
  <div class="sub">{{SUB}}</div>
  <div class="meta">
    {{DATA_SOURCES}}
  </div>
</div>

<!-- ═════ 缘起 ═════ -->
<div class="hl-box orange" style="background:#FFF3E0; border-left:4px solid #e65100; margin: 0 0 28px 0;">
<p><strong>缘起：</strong>{{PROLOGUE}}</p>
</div>

<!-- ═════ SECTIONS ═════ -->
{{SECTIONS}}

<!-- ═════ INSIGHT ═════ -->
<div class="insight">
  <h3>💡 观察启示</h3>
  <ul>
    {{INSIGHT_ITEMS}}
  </ul>
</div>

{{OUTRO}}

<!-- ── Footer ── -->
<div class="footer">
  张走走的行业观察笔记 · 个人观点、动态观察、持续思考<br>
  <span id="busuanzi_container_site_pv">访问 <span id="busuanzi_value_site_pv"></span> 次</span> ·
  <span id="busuanzi_container_site_uv">访客 <span id="busuanzi_value_site_uv"></span> 人</span>
</div>

<!-- ── 浮动导航 ── -->
<div style="position:fixed;right:24px;bottom:28px;z-index:999;display:flex;flex-direction:column;gap:12px;align-items:flex-end;">
  <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" id="btn-top" style="display:inline-flex;align-items:center;gap:6px;padding:14px 24px;min-width:48px;min-height:48px;background:#e65100;color:#fff;border-radius:24px;font-size:16px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.18);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;">↑ 顶部</a>
  <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:14px 24px;min-width:48px;min-height:48px;background:#0d47a1;color:#fff;border-radius:24px;font-size:16px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.18);white-space:nowrap;">← 首页</a>
</div>
<script>
(function(){
  var btn=document.getElementById('btn-top');
  window.addEventListener('scroll',function(){
    var show=window.scrollY>400;
    btn.style.opacity=show?'1':'0';
    btn.style.pointerEvents=show?'auto':'none';
  });
  var mq=window.matchMedia('print');
  mq.addListener(function(e){
    btn.style.display=e.matches?'none':'';
  });
})();
</script>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
